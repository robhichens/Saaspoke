<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hichens &amp; Sons — Software built around the way you work.</title>
    <meta
      name="description"
      content="Hichens &amp; Sons is an operational software studio for owner-operated businesses. We learn how your business actually works, then build focused software that removes friction and hands your team its time back."
    />
    <meta property="og:title" content="Hichens &amp; Sons — Software built around the way you work." />
    <meta
      property="og:description"
      content="An operational software studio for owner-operated businesses. We learn the work, remove the friction, and give your team its time back — built by an operator, not a vendor."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Self-hosted fonts: preload the three that paint above the fold -->
    <link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/general-sans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-mono-400.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <!-- Static form so Netlify registers the contact form at deploy time -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="business" />
      <textarea name="message"></textarea>
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

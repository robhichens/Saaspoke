<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saaspoke — Software, made to measure.</title>
    <meta
      name="description"
      content="Saaspoke builds purpose-built software for American family businesses — scoped to exactly how you already work, priced for a real budget, built by someone who's run one."
    />
    <meta property="og:title" content="Saaspoke — Software, made to measure." />
    <meta
      property="og:description"
      content="Purpose-built tools for family businesses. Flat pricing, no tiers, built by an operator — not a vendor."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Self-hosted fonts: preload the three that paint above the fold -->
    <link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/general-sans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-mono-400.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <!-- Static form so Netlify registers the contact form at deploy time -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="business" />
      <textarea name="message"></textarea>
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
